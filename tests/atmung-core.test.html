<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tests Atmung-Kern</title>
<style>body{font:14px monospace;padding:16px;white-space:pre-wrap;}</style>
</head>
<body>
<div id="out"></div>
<script src="../atmung-core.js"></script>
<script>
(function(){
  const C = window.AtemCore;
  const lines = [];
  let failed = 0, passed = 0;
  function test(name, fn){
    try{ fn(); passed++; lines.push('ok    ' + name); }
    catch(e){ failed++; lines.push('FAIL  ' + name + ': ' + e.message); }
  }
  function eq(actual, expected, label){
    if(actual !== expected) throw new Error((label || '') + ' erwartet ' + expected + ', erhalten ' + actual);
  }
  function near(actual, expected, tolerance, label){
    if(Math.abs(actual - expected) > tolerance) throw new Error((label || '') + ' erwartet ' + expected + ' ± ' + tolerance + ', erhalten ' + actual);
  }
  function bytes(list){ return new DataView(new Uint8Array(list).buffer); }
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function feed(values, stepMs){
    const p = new C.SignalPipeline();
    let now = 100000;
    values.forEach(rr => { now += stepMs || rr; p.ingest([rr], now); });
    return p;
  }

  /* ---------- Parser ---------- */
  test('Parser: uint8 ohne RR', () => {
    const r = C.parseHeartRateMeasurement(bytes([0x00, 72]));
    eq(r.hr, 72); eq(r.rrMs.length, 0);
  });
  test('Parser: uint16 Little Endian', () => {
    eq(C.parseHeartRateMeasurement(bytes([0x01, 0x2C, 0x01])).hr, 300);
  });
  test('Parser: RR-Einheit 1/1024 s', () => {
    const r = C.parseHeartRateMeasurement(bytes([0x10, 60, 0x00, 0x04]));
    eq(r.rrMs.length, 1); near(r.rrMs[0], 1000, 1e-9);
  });
  test('Parser: mehrere RR-Werte', () => {
    const r = C.parseHeartRateMeasurement(bytes([0x10, 60, 0x00, 0x04, 0x00, 0x02]));
    eq(r.rrMs.length, 2); near(r.rrMs[1], 500, 1e-9);
  });
  test('Parser: Energy Expended wird übersprungen', () => {
    const r = C.parseHeartRateMeasurement(bytes([0x18, 60, 0xFF, 0xFF, 0x00, 0x04]));
    eq(r.rrMs.length, 1); near(r.rrMs[0], 1000, 1e-9);
  });
  test('Parser: uint16 mit Energy und RR', () => {
    const r = C.parseHeartRateMeasurement(bytes([0x19, 60, 0x00, 0x01, 0x00, 0x00, 0x04]));
    eq(r.hr, 60); eq(r.rrMs.length, 1); near(r.rrMs[0], 1000, 1e-9);
  });
  test('Parser: unvollständiges Byte am Ende wird ignoriert', () => {
    eq(C.parseHeartRateMeasurement(bytes([0x10, 60, 0x00, 0x04, 0x01])).rrMs.length, 1);
  });
  test('Parser: zu kurzes Paket liefert null', () => {
    eq(C.parseHeartRateMeasurement(bytes([0x00])), null);
    eq(C.parseHeartRateMeasurement(bytes([0x01, 0x10])), null);
  });
  test('Encoder und Parser sind zueinander passend', () => {
    const r = C.parseHeartRateMeasurement(C.encodeHeartRateMeasurement({hr:66, rrMs:[900, 950], energy:12}));
    eq(r.hr, 66); near(r.rrMs[0], 900, 1); near(r.rrMs[1], 950, 1);
  });

  /* ---------- Artefakte ---------- */
  test('Filter: Status bleibt offen bis 2 Folgeschläge da sind', () => {
    const p = feed([900, 900, 900]);
    eq(p.beats[0].status, 'ok'); eq(p.beats[1].status, 'pending'); eq(p.beats[2].status, 'pending');
    p.finish();
    eq(p.beats[2].status, 'ok');
  });
  test('Filter: RR außerhalb 300–2000 ms', () => {
    const p = feed([900, 299, 900, 2001, 900, 900, 900], 900);
    p.finish();
    eq(p.beats[1].status, 'range'); eq(p.beats[3].status, 'range'); eq(p.beats[2].status, 'ok');
  });
  test('Filter: Grenzwerte 300 und 2000 ms sind kein Bereichsartefakt', () => {
    const p = feed([300, 2000], 900);
    eq(p.beats[0].status === 'range', false); eq(p.beats[1].status === 'range', false);
  });
  test('Filter: Extraschlag und Kompensation werden beide erkannt', () => {
    const p = feed([900, 900, 900, 540, 1260, 900, 900, 900]);
    p.finish();
    eq(p.beats[3].status, 'median'); eq(p.beats[4].status, 'median'); eq(p.beats[2].status, 'ok'); eq(p.beats[5].status, 'ok');
  });
  test('Filter: verpasster Schlag', () => {
    const p = feed([900, 900, 900, 1800, 900, 900, 900]);
    p.finish();
    eq(p.beats[3].status, 'median'); eq(Core_ok(p), 6);
  });
  function Core_ok(p){ return p.beats.filter(b => b.status === 'ok').length; }

  test('Filter: milder verschobener Schlag unter der 20-%-Grenze wird erkannt', () => {
    const p = feed([960, 965, 970, 965, 960, 812, 1130, 965, 970, 960, 965, 970]);
    p.finish();
    eq(p.beats[5].status, 'median'); eq(p.beats[6].status, 'median');
    eq(p.beats[4].status, 'ok'); eq(p.beats[7].status, 'ok');
  });
  test('Filter: verspäteter Schlag (lang + kurz) wird ebenso erkannt', () => {
    const p = feed([960, 965, 970, 965, 960, 1130, 812, 965, 970, 960, 965, 970]);
    p.finish();
    eq(p.beats[5].status, 'median'); eq(p.beats[6].status, 'median');
  });
  test('Filter: mehrere verschobene Schläge in Folge', () => {
    const p = feed([960, 965, 970, 965, 782, 1158, 812, 1149, 962, 979, 971, 973]);
    p.finish();
    [4, 5, 6, 7].forEach(i => eq(p.beats[i].status, 'median', 'Schlag ' + i));
    eq(p.beats[8].status, 'ok');
  });
  test('Filter: stetige RSA-Bewegung gilt nicht als verschobener Schlag', () => {
    const p = feed([788, 791, 820, 840, 861, 886, 900, 910, 905, 894, 877, 867, 859, 854, 856, 858, 867, 885]);
    p.finish();
    eq(p.beats.filter(b => b.status !== 'ok').length, 0);
  });
  test('Filter: Störphase wie beim Ablegen des Gurts bleibt nicht als ok stehen', () => {
    const rest = Array.from({length:40}, (_, i) => 900 + (i % 3) * 5);
    // Abfolge aus einer realen Aufzeichnung: 312 liegt nah am gestörten Fenster-Median
    const noise = [421, 1150, 991, 387, 312, 595, 349];
    const p = feed(rest.concat(noise, rest));
    p.finish();
    p.beats.slice(40, 47).forEach(b => { if(b.status === 'ok' && (b.rr < 500 || b.rr > 1300)) throw new Error('RR ' + b.rr + ' gilt als ok'); });
    eq(p.beats[p.beats.length - 1].status, 'ok');
  });
  test('Filter: echter dauerhafter HF-Wechsel sperrt die Erkennung nicht aus', () => {
    const p = feed(Array(30).fill(1000).concat(Array(40).fill(450)));
    p.finish();
    eq(p.beats[p.beats.length - 5].status, 'ok');
  });

  /* Vergleich: nachlaufender Median der letzten 5 (Auftrag) gegen zentrierten Median */
  function trailingFlags(values){
    const valid = [];
    return values.map(rr => {
      if(rr < 300 || rr > 2000) return true;
      let flagged = false;
      if(valid.length >= 5){
        const m = C.median(valid.slice(-5));
        flagged = Math.abs(rr - m) / m > 0.2;
      }
      if(!flagged) valid.push(rr);
      return flagged;
    });
  }
  function simulate(profile, count, seed, artefactProb){
    const gen = C.createRrSimulator(Object.assign({rng:mulberry32(seed), artefactProb}, profile));
    const list = [];
    for(let i = 0; i < count; i++) list.push(gen.next());
    return list;
  }
  function falseRate(flags, truth){
    let clean = 0, wrong = 0;
    truth.forEach((beat, i) => { if(!beat.injected){ clean++; if(flags[i]) wrong++; } });
    return wrong / clean;
  }
  function pipelineFlags(truth){
    const p = feed(truth.map(b => b.rr));
    p.finish();
    return p.beats.map(b => b.status !== 'ok');
  }
  const STRONG = {meanRr:1030, amplitude:170};
  const VERY_STRONG = {meanRr:1100, amplitude:260};
  test('Filter: starke RSA wird nicht als Artefakt verworfen (zentriert < 1 %)', () => {
    const truth = simulate(STRONG, 6000, 1, 0);
    const centred = falseRate(pipelineFlags(truth), truth);
    const trailing = falseRate(trailingFlags(truth.map(b => b.rr)), truth);
    lines.push('      Fehlalarme bei 1030 ± 170 ms: zentriert ' + (centred * 100).toFixed(2) + ' %, nachlaufend ' + (trailing * 100).toFixed(2) + ' %');
    if(centred >= 0.01) throw new Error('zu viele Fehlalarme: ' + centred);
  });
  test('Filter: Messung bei sehr starker RSA', () => {
    const truth = simulate(VERY_STRONG, 6000, 2, 0);
    lines.push('      Fehlalarme bei 1100 ± 260 ms: zentriert ' + (falseRate(pipelineFlags(truth), truth) * 100).toFixed(2) +
      ' %, nachlaufend ' + (falseRate(trailingFlags(truth.map(b => b.rr)), truth) * 100).toFixed(2) + ' %');
  });
  test('Filter: erkennt mindestens 90 % eingestreuter Artefakte', () => {
    const truth = simulate({meanRr:900, amplitude:60}, 20000, 3, 0.01);
    const flags = pipelineFlags(truth);
    let injected = 0, found = 0;
    truth.forEach((beat, i) => { if(beat.injected){ injected++; if(flags[i]) found++; } });
    lines.push('      Erkannt: ' + found + ' von ' + injected);
    if(found / injected < 0.9) throw new Error('nur ' + found + ' von ' + injected);
  });

  /* ---------- Kennwerte ---------- */
  test('RMSSD: bekannter Wert', () => {
    const p = feed([800, 810, 790, 800]);
    p.finish();
    near(C.rmssd(p.beats), Math.sqrt(200), 1e-9);
    near(C.lnRmssd(p.beats), Math.log(Math.sqrt(200)), 1e-9);
  });
  test('RMSSD: kein Paar über ein Artefakt hinweg', () => {
    const p = feed([900, 910, 900, 1800, 920, 930, 920, 930]);
    p.finish();
    eq(p.beats[3].status, 'median');
    // Paare: 900-910, 910-900, 920-930, 930-920, 920-930; alle |d| = 10
    near(C.rmssd(p.beats), 10, 1e-9);
  });
  test('RMSSD: kein Paar über einen Signalabriss hinweg', () => {
    const p = new C.SignalPipeline();
    let now = 0;
    [900, 910, 900].forEach(rr => { now += rr; p.ingest([rr], now); });
    now += 30000;
    [500, 510, 500].forEach((rr, i) => { if(i) now += rr; p.ingest([rr], now); });
    p.finish();
    eq(p.gaps, 1);
    near(C.rmssd(p.beats), 10, 1e-9);
  });
  test('RMSSD: ohne Paar null', () => {
    eq(C.rmssd([]), null); eq(C.lnRmssd([]), null);
  });
  test('Signalqualität: Grenzen', () => {
    eq(C.signalQuality(null), null);
    eq(C.signalQuality(0.0199), 'gut');
    eq(C.signalQuality(0.02), 'mäßig');
    eq(C.signalQuality(0.05), 'mäßig');
    eq(C.signalQuality(0.0501), 'schlecht');
  });
  test('Artefaktquote zählt offene Schläge nicht mit', () => {
    const stats = C.artefactStats([{status:'ok'}, {status:'median'}, {status:'range'}, {status:'ok'}, {status:'pending'}]);
    eq(stats.total, 4); eq(stats.artefacts, 2); eq(stats.rate, 0.5); eq(stats.quality, 'schlecht');
  });
  test('RSA: HFmax − HFmin im Zyklus', () => {
    const beats = [{t:1, rr:1000, status:'ok'}, {t:2, rr:750, status:'ok'}, {t:3, rr:600, status:'ok'}, {t:20, rr:300, status:'ok'}];
    near(C.rsaAmplitude(beats, 0, 10), 40, 1e-9);
  });
  test('RSA: Zyklus mit Artefakt wird nicht gewertet', () => {
    const beats = [{t:1, rr:1000, status:'ok'}, {t:2, rr:750, status:'ok'}, {t:3, rr:600, status:'ok'}, {t:4, rr:400, status:'median'},
      {t:11, rr:1000, status:'ok'}, {t:12, rr:900, status:'ok'}, {t:13, rr:800, status:'ok'}];
    const s = C.rsaSummary(beats, [{start:0, end:10}, {start:10, end:20}]);
    eq(s.perCycle[0], null); near(s.perCycle[1], 15, 1e-9); near(s.mean, 15, 1e-9);
  });
  test('RSA: noch ungeprüfte Schläge schließen einen Zyklus nicht aus', () => {
    const beats = [{t:1, rr:1000, status:'ok'}, {t:2, rr:750, status:'ok'}, {t:3, rr:600, status:'ok'}, {t:4, rr:400, status:'pending'}];
    near(C.rsaAmplitude(beats, 0, 10), 40, 1e-9);
  });
  test('RSA: zu wenige Schläge ergeben null und zählen nicht im Mittel', () => {
    const beats = [{t:1, rr:1000, status:'ok'}, {t:2, rr:750, status:'ok'}, {t:3, rr:600, status:'ok'}, {t:11, rr:900, status:'ok'}];
    const s = C.rsaSummary(beats, [{start:0, end:10}, {start:10, end:20}]);
    eq(s.perCycle[1], null); near(s.mean, 40, 1e-9); near(s.last, 40, 1e-9);
  });
  test('RSA: Simulator-Amplitude wird im 10-s-Zyklus getroffen', () => {
    const gen = C.createRrSimulator({meanRr:900, amplitude:60, noiseSd:0, artefactProb:0});
    const p = new C.SignalPipeline();
    let now = 0;
    for(let i = 0; i < 200; i++){ const {rr} = gen.next(); now += rr; p.ingest([rr], now); }
    p.finish();
    const cycles = [];
    for(let start = p.beats[0].t; start + 10000 <= p.beats[p.beats.length - 1].t; start += 10000) cycles.push({start, end:start + 10000});
    // 900 ± 60 ms entspricht rund 62,5 bis 71,4 bpm
    near(C.rsaSummary(p.beats, cycles).mean, 8.9, 1.2);
  });

  /* ---------- Atemmuster ---------- */
  test('Muster: 6/min 1:1 ergibt 5 s ein, 5 s aus', () => {
    const p = C.buildBreathPattern(6, '1:1');
    eq(p.cycleMs, 10000); near(p.phases[0].ms, 5000, 1e-9); near(p.phases[1].ms, 5000, 1e-9);
  });
  test('Muster: 6/min 4:6 ergibt 4 s ein, 6 s aus', () => {
    const p = C.buildBreathPattern(6, '4:6');
    near(p.phases[0].ms, 4000, 1e-9); near(p.phases[1].ms, 6000, 1e-9);
  });
  test('Muster: 4,5/min dauert 13,33 s pro Zyklus', () => {
    near(C.buildBreathPattern(4.5, '1:1').cycleMs, 13333.33, 0.01);
  });
  test('Pacer: Phasen und Füllstand im 1:1-Muster', () => {
    const p = C.buildBreathPattern(6, '1:1');
    let s = C.pacerState(p, 0);
    eq(s.kind, 'in'); near(s.level, 0, 1e-9);
    s = C.pacerState(p, 2500);
    near(s.level, 0.5, 1e-9);
    s = C.pacerState(p, 4999.999);
    eq(s.kind, 'in'); near(s.level, 1, 1e-6);
    s = C.pacerState(p, 5000);
    eq(s.kind, 'out'); near(s.level, 1, 1e-9);
    s = C.pacerState(p, 10000);
    eq(s.kind, 'in'); eq(s.cycleIndex, 1); near(s.level, 0, 1e-9);
  });
  test('Pacer: Füllstand springt an keiner Stelle', () => {
    [C.buildBreathPattern(6, '1:1'), C.buildBreathPattern(5.5, '4:6'), C.buildBreathPattern(4.5, '1:1')].forEach(p => {
      let last = C.pacerState(p, 0).level;
      for(let t = 16; t < 60000; t += 16){
        const level = C.pacerState(p, t).level;
        if(Math.abs(level - last) > 0.02) throw new Error('Sprung bei ' + t + ': ' + last + ' auf ' + level);
        last = level;
      }
    });
  });
  test('Pacer: Zyklen sind nur abgeschlossene', () => {
    const p = C.buildBreathPattern(6, '1:1');
    eq(C.pacerCycles(p, 1000, 1000 + 29999).length, 2);
    eq(C.pacerCycles(p, 1000, 1000 + 30000).length, 3);
    eq(C.pacerCycles(p, 1000, 1000 + 30000)[1].start, 11000);
  });
  test('Pacer: Bänder decken den Bereich lückenlos ab', () => {
    const bands = C.pacerBands(C.buildBreathPattern(6, '4:6'), 1000, 3000, 12000);
    eq(bands[0].kind, 'in'); eq(bands[0].start, 3000); eq(bands[0].end, 5000);
    eq(bands[1].kind, 'out'); eq(bands[1].end, 11000);
    eq(bands[2].kind, 'in'); eq(bands[2].end, 12000);
    eq(bands.length, 3);
  });

  test('Seufzen: doppelte Einatmung, lange Ausatmung, ohne Sprung', () => {
    const p = C.buildSighPattern();
    eq(p.phases.length, 3); eq(p.phases[2].kind, 'out'); eq(p.cycleMs, 9000);
    if(!(p.phases[2].ms > p.phases[0].ms + p.phases[1].ms)) throw new Error('Ausatmung nicht länger');
    let last = C.pacerState(p, 0).level;
    for(let t = 16; t < 30000; t += 16){
      const level = C.pacerState(p, t).level;
      if(Math.abs(level - last) > 0.02) throw new Error('Sprung bei ' + t);
      last = level;
    }
    eq(C.pacerState(p, 2500).label, 'Nachatmen (Nase)');
  });

  /* ---------- Resonanzfrequenz-Test ---------- */
  const rfStep = (bpm, rsaMean, cycles) => ({bpm, rsaMean, cycles:cycles === undefined ? 10 : cycles, valid:(cycles === undefined ? 10 : cycles) >= C.RF_MIN_CYCLES});
  test('RF: Protokoll wie im Auftrag', () => {
    eq(C.RF_STEPS.join(), '6.5,6,5.5,5,4.5'); eq(C.RF_STEP_MS, 120000); eq(C.RF_PAUSE_MS, 30000);
  });
  test('RF: klare Stufe wird vorgeschlagen', () => {
    const r = C.evaluateRfSteps([rfStep(6.5, 8), rfStep(6, 9), rfStep(5.5, 14), rfStep(5, 11), rfStep(4.5, 10)]);
    eq(r.recommendedBpm, 5.5); eq(r.close, false); eq(r.alternativeBpm, null);
  });
  test('RF: unter 10 % Abstand nennt beide Kandidaten', () => {
    const r = C.evaluateRfSteps([rfStep(6, 10), rfStep(5.5, 9.5), rfStep(5, 5)]);
    eq(r.recommendedBpm, 6); eq(r.close, true); eq(r.alternativeBpm, 5.5);
  });
  test('RF: genau 10 % Abstand ist nicht mehr knapp', () => {
    const r = C.evaluateRfSteps([rfStep(6, 10), rfStep(5.5, 9)]);
    eq(r.close, false);
  });
  test('RF: Stufe mit zu wenigen Zyklen zählt nicht', () => {
    const r = C.evaluateRfSteps([rfStep(6, 50, 4), rfStep(5.5, 9)]);
    eq(r.recommendedBpm, 5.5);
  });
  test('RF: ohne gültige Stufe kein Vorschlag', () => {
    const r = C.evaluateRfSteps([rfStep(6, 50, 2)]);
    eq(r.recommendedBpm, null); eq(r.close, false);
  });
  test('RF: Stufenwerte aus Schlägen, übersprungene Stufe ungültig', () => {
    const gen = C.createRrSimulator({meanRr:900, amplitude:60, breathHz:0.1, noiseSd:0, artefactProb:0});
    const p = new C.SignalPipeline();
    let now = 0;
    while(now < 130000){ const {rr} = gen.next(); now += rr; p.ingest([rr], now); }
    p.finish();
    const s = C.rfStepStats(p.beats, C.buildBreathPattern(6, '1:1'), {start:0, end:120000});
    eq(s.bpm, 6); eq(s.cycles, 12); eq(s.valid, true); near(s.rsaMean, 8.9, 1.2); eq(s.artefactRate, 0);
    eq(C.rfStepStats(p.beats, C.buildBreathPattern(5, '1:1'), null).valid, false);
    eq(C.rfStepStats(p.beats, C.buildBreathPattern(5, '1:1'), {start:0, end:30000}).valid, false);
  });

  /* ---------- Trainingspläne ---------- */
  const unit = o => Object.assign({tag:'taeglich', zeit:'abend', technik:'spb', frequenz:6, ie:'1:1', dauerMin:10}, o);
  const plan = weeks => ({name:'Test', weeks:weeks.map(sessions => ({sessions}))});
  function planError(p){ return C.validatePlan(p) || ''; }
  test('Plan: Standardpläne sind gültig und wie im Auftrag aufgebaut', () => {
    eq(C.STANDARD_PLANS.length, 2);
    C.STANDARD_PLANS.forEach(p => { if(/Breathlete|DSHS/.test(p.quelle)) throw new Error('Unbelegte Quelle in ' + p.id); });
    C.STANDARD_PLANS.forEach(p => eq(C.validatePlan(p), null, p.id));
    const [einstieg, intensiv] = C.STANDARD_PLANS;
    eq(einstieg.weeks.length, 4); eq(intensiv.weeks.length, 5);
    eq(einstieg.weeks[0].sessions[0].technik, 'rf-test'); eq(einstieg.weeks[0].sessions[1].dauerMin, 10); eq(einstieg.weeks[0].sessions[1].frequenz, 6);
    eq(einstieg.weeks[1].sessions[0].dauerMin, 15); eq(einstieg.weeks[2].sessions[0].frequenz, 'rf');
    eq(intensiv.weeks[0].sessions.length, 3); eq(intensiv.weeks[0].sessions[1].dauerMin, 10);
    eq(intensiv.weeks[1].sessions[1].dauerMin, 20); eq(intensiv.weeks[2].sessions[0].technik, 'rf-test');
    eq(intensiv.weeks[4].sessions.length, 2);
  });
  test('Plan: Prüfung weist Fehler verständlich zurück', () => {
    eq(C.validatePlan(plan([[unit()]])), null);
    if(!planError(null)) throw new Error('null');
    if(!planError([]).includes('Objekt')) throw new Error('Array');
    if(!planError({weeks:[]}).includes('name')) throw new Error('name');
    if(!planError({name:'x', weeks:[]}).includes('weeks')) throw new Error('weeks');
    if(!planError({name:'x', typ:'rad', weeks:[{sessions:[]}]}).includes('typ')) throw new Error('typ');
    if(!planError({name:'x', startDate:'2026-01-01', weeks:[{phaseLabel:'a', phaseColor:'b'}]}).includes('sessions')) throw new Error('Radblock');
    if(!planError(plan([[unit({technik:'x'})]])).includes('technik')) throw new Error('technik');
    if(!planError(plan([[unit({tag:'montag'})]])).includes('tag')) throw new Error('tag');
    if(!planError(plan([[unit({zeit:'mittag'})]])).includes('zeit')) throw new Error('zeit');
    if(!planError(plan([[unit({frequenz:4})]])).includes('frequenz')) throw new Error('frequenz 4');
    if(!planError(plan([[unit({ie:'2:1'})]])).includes('ie')) throw new Error('ie');
    if(!planError(plan([[unit({dauerMin:0})]])).includes('dauerMin')) throw new Error('dauer');
    eq(C.validatePlan(plan([[unit({frequenz:'rf'})]])), null);
    eq(C.validatePlan(plan([[{tag:'einmalig', technik:'rf-test'}]])), null);
  });
  test('Plan: Normalisieren verwirft Unbekanntes und vergibt IDs', () => {
    const n = C.normalizePlan({name:'A', evil:1, weeks:[{sessions:[unit({extra:1}), {tag:'einmalig', technik:'rf-test'}]}]}, 'id1');
    eq(n.id, 'id1'); eq(n.typ, 'atmung'); eq(n.evil, undefined); eq(n.quelle, '');
    eq(n.weeks[0].sessions[0].id, 'w1-u1'); eq(n.weeks[0].sessions[0].extra, undefined); eq(n.weeks[0].sessions[1].id, 'w1-u2');
    eq(n.weeks[0].sessions[1].zeit, 'frei'); eq(n.weeks[0].sessions[1].frequenz, undefined);
  });
  const P = C.normalizePlan(plan([[unit(), {tag:'einmalig', technik:'rf-test'}], [unit({dauerMin:15})]]), 'p');
  const rec = (date, unitId, planId) => ({date, unitId, planId:planId || 'p'});
  test('Plan: Wochenindex auch über Sommerzeit-Wechsel', () => {
    eq(C.planWeekIndex('2026-10-19', '2026-10-25'), 0);
    eq(C.planWeekIndex('2026-10-19', '2026-10-26'), 1);
    eq(C.planWeekIndex('2026-10-19', '2026-10-18'), -1);
    eq(C.planWeekIndex('2026-03-23', '2026-03-30'), 1);
  });
  test('Plan: Einheiten des Tages und erledigt-Status', () => {
    let day = C.unitsForDay(P, '2026-11-02', '2026-11-03', []);
    eq(day.length, 2); eq(day[0].done, false); eq(day[0].weekIndex, 0);
    day = C.unitsForDay(P, '2026-11-02', '2026-11-03', [rec('2026-11-03', 'w1-u1')]);
    eq(day[0].done, true);
    day = C.unitsForDay(P, '2026-11-02', '2026-11-04', [rec('2026-11-03', 'w1-u1')]);
    eq(day[0].done, false, 'täglich gilt neu');
    day = C.unitsForDay(P, '2026-11-02', '2026-11-05', [rec('2026-11-03', 'w1-u2')]);
    eq(day[1].done, true, 'einmalig bleibt erledigt');
  });
  test('Plan: anderer Plan und Zeit davor zählen nicht', () => {
    eq(C.unitsForDay(P, '2026-11-02', '2026-11-03', [rec('2026-11-03', 'w1-u1', 'q')])[0].done, false);
    eq(C.unitsForDay(P, '2026-11-02', '2026-11-05', [rec('2026-11-01', 'w1-u2')])[1].done, false);
  });
  test('Plan: außerhalb des Zeitraums keine Einheiten', () => {
    eq(C.unitsForDay(P, '2026-11-02', '2026-11-01', []).length, 0);
    eq(C.unitsForDay(P, '2026-11-02', '2026-11-16', []).length, 0);
    eq(C.unitsForDay(P, '2026-11-02', '2026-11-15', []).length, 1);
  });
  test('Plan: Wochenfortschritt zählt Tage, nicht Wiederholungen', () => {
    const r = [rec('2026-11-03', 'w1-u1'), rec('2026-11-03', 'w1-u1'), rec('2026-11-04', 'w1-u1'), rec('2026-11-04', 'w1-u2'), rec('2026-11-05', 'w1-u2')];
    const g = C.weekProgress(P, '2026-11-02', 0, r);
    eq(g.planned, 8); eq(g.done, 3);
  });
  test('Plan: persönliche Frequenz fällt ohne Test auf 6/min zurück', () => {
    eq(C.resolveFrequency('rf', 5.5), 5.5); eq(C.resolveFrequency('rf', null), 6); eq(C.resolveFrequency(5, 5.5), 5);
  });

  /* ---------- Verlauf ---------- */
  const practice = (date, durationSec) => ({date, durationSec, technik:'spb'});
  test('Verlauf: Übungstage der Woche laufen von Montag bis Sonntag', () => {
    const r = [practice('2026-11-01', 60), practice('2026-11-02', 60), practice('2026-11-02', 60), practice('2026-11-04', 60), practice('2026-11-09', 60)];
    eq(C.weekActiveDays(r, '2026-11-03'), 2);   // Di, 03.11.: Mo 02.11. und Mi 04.11.
    eq(C.weekActiveDays(r, '2026-11-08'), 2);   // Sonntag gehört noch dazu
    eq(C.weekActiveDays(r, '2026-11-01'), 1);   // Vorwoche
    eq(C.weekActiveDays([], '2026-11-03'), 0);
  });
  test('Verlauf: Heatmap hat 12 Wochen ab Montag und markiert Zukunft', () => {
    const h = C.practiceHeatmap([practice('2026-11-03', 600), practice('2026-11-03', 300)], '2026-11-03', 12);
    eq(h.length, 12); eq(h[0].length, 7);
    eq(h[11][0].date, '2026-11-02'); eq(h[11][1].date, '2026-11-03'); eq(h[11][1].minutes, 15);
    eq(h[11][1].future, false); eq(h[11][2].future, true);
    eq(h[0][0].date, '2026-08-17');
  });
  test('Verlauf: Heatmap bleibt über Sommerzeit-Wechsel korrekt', () => {
    const h = C.practiceHeatmap([], '2026-11-03', 12);
    h.forEach((week, i) => { if(i) eq(C.planWeekIndex(h[i - 1][0].date, week[0].date), 1); });
  });
  test('Verlauf: Minuten je Woche, auch mit Testeintrag', () => {
    const w = C.minutesPerWeek([practice('2026-11-03', 600), {date:'2026-11-04', technik:'rf-test'}, practice('2026-10-27', 300)], '2026-11-03', 3);
    eq(w.length, 3); eq(w[2].weekStart, '2026-11-02'); eq(w[2].minutes, 20); eq(w[1].minutes, 5); eq(w[0].minutes, 0);
  });
  test('Verlauf: Wochenvergleich überspringt fehlende Werte', () => {
    const r = [{date:'2026-11-03', v:14}, {date:'2026-11-04', v:null}, {date:'2026-10-27', v:10}, {date:'2026-10-28', v:12}];
    const c = C.weeklyComparison(r, '2026-11-05', x => x.v);
    eq(c.current, 14); eq(c.previous, 11);
    eq(C.weeklyComparison([], '2026-11-05', x => x.v).current, null);
  });
  test('CSV: deutsches Trennzeichen, Dezimalkomma und sichere Notizen', () => {
    const csv = C.sessionsToCsv([{date:'2026-11-03', time:'20:15', technik:'spb', bpm:4.5, ie:'1:1', durationSec:600, baseline:{rmssd:15.5, lnRmssd:2.74, hr:60}, post:null, rsaMean:5.3, artefactRate:0, tensionBefore:0, tensionAfter:null, note:'a;"b"'},
      {date:'2026-11-04', technik:'sigh', note:'=SUMME(A1)'}]);
    const lines = csv.split('\r\n');
    eq(lines.length, 4); eq(lines[3], '');
    const header = lines[0].split(';');
    const row = lines[1].split(';');
    eq(row[header.indexOf('Atemzuege/min')], '4,5');
    eq(row[header.indexOf('RMSSD vorher')], '15,5');
    eq(row[header.indexOf('Anspannung vorher')], '0');
    eq(row[header.indexOf('Anspannung nachher')], '');
    if(!lines[1].endsWith(String.fromCharCode(34) + 'a;' + String.fromCharCode(34, 34) + 'b' + String.fromCharCode(34, 34, 34))) throw new Error('Quote: ' + lines[1]);
    if(!lines[2].endsWith("'=SUMME(A1)")) throw new Error('Formel: ' + lines[2]);
  });

  /* ---------- Morgen-HRV ---------- */
  const morning = (date, lnRmssd, extra) => Object.assign({date, lnRmssd, source:'ble', quality:'gut'}, extra);
  function dayList(start, values){
    return values.map((ln, i) => {
      const d = new Date(Date.UTC(2026, 9, start + i));
      return morning(d.toISOString().slice(0, 10), ln);
    });
  }
  test('Morgen: Protokoll 2 min, erste 30 s verworfen', () => {
    eq(C.MORNING_SETTLE_MS + C.MORNING_MEASURE_MS, 120000); eq(C.MORNING_SETTLE_MS, 30000);
  });
  test('Morgen: 7-Tage-Mittel erst ab 3 Werten, Band erst ab 7', () => {
    const s = C.morningSeries(dayList(1, [3, 3.2, 3.4, 3, 3, 3, 3.1]));
    eq(s[1].mean7, null); near(s[2].mean7, 3.2, 1e-9);
    eq(s[5].bandLow, null);
    if(!(s[6].bandLow < s[6].bandHigh)) throw new Error('Band');
  });
  test('Morgen: 7-Tage-Mittel und Band sind richtig berechnet', () => {
    const values = [3, 3.2, 3, 3.2, 3, 3.2, 3, 3.2];
    const s = C.morningSeries(dayList(1, values));
    const last = s[s.length - 1];
    const week = values.slice(-7), m = week.reduce((a, b) => a + b) / 7;
    near(last.mean7, m, 1e-9);
    const all = values.reduce((a, b) => a + b) / 8;
    const sd = Math.sqrt(values.reduce((a, b) => a + (b - all) * (b - all), 0) / 7);
    near(last.bandLow, all - 0.5 * sd, 1e-9); near(last.bandHigh, all + 0.5 * sd, 1e-9);
  });
  test('Morgen: Simulator, gestörte Messung und Doppelmessung', () => {
    const s = C.morningSeries([morning('2026-10-01', 3), morning('2026-10-01', 3.5), morning('2026-10-02', 9, {source:'sim'}), morning('2026-10-03', 9, {quality:'schlecht'}), morning('2026-10-04', null)]);
    eq(s.length, 1); eq(s[0].ln, 3.5);
  });
  test('Morgen: Hinweis nur unter dem Band und bei aktuellen Daten', () => {
    const base = Array(14).fill(0).map((_, i) => 3.5 + (i % 2) * 0.1);
    const s = C.morningSeries(dayList(1, base.concat([3, 2.9, 2.8, 3, 2.9, 3, 2.9])));
    const lastDate = s[s.length - 1].date;
    eq(C.morningBelowBand(s, lastDate), true);
    eq(C.morningBelowBand(s, '2026-10-30'), false, 'veraltet');
    const fine = C.morningSeries(dayList(1, base.concat(base)));
    eq(C.morningBelowBand(fine, fine[fine.length - 1].date), false);
    eq(C.morningBelowBand([], '2026-10-30'), false);
  });

  /* ---------- Session-Auswertung ---------- */
  function simulatedRun(){
    const gen = C.createRrSimulator({meanRr:900, amplitude:60, breathHz:0.1, noiseSd:0, artefactProb:0});
    const p = new C.SignalPipeline();
    let now = 0;
    while(now < 240000){ const {rr} = gen.next(); now += rr; p.ingest([rr], now); }
    p.finish();
    return p;
  }
  test('Auswertung: Abschnitte werden getrennt berechnet', () => {
    const p = simulatedRun();
    const s = C.summarizeSession({
      beats: p.beats, pattern: C.buildBreathPattern(6, '1:1'),
      baseline: {start:0, end:60000}, pacer: {start:60000, end:180000}, post: {start:180000, end:240000}
    });
    near(s.baseline.hr, 66.7, 1.5); near(s.post.hr, 66.7, 1.5);
    if(!(s.baseline.rmssd > 0) || !(s.post.rmssd > 0)) throw new Error('RMSSD fehlt');
    near(s.rsaMean, 8.9, 1.2);
    eq(s.cycleCount, 12); eq(s.quality, 'gut'); eq(s.artefactCount, 0);
  });
  test('Auswertung: ohne Gurtdaten bleibt alles leer statt falsch', () => {
    const s = C.summarizeSession({beats:[], pattern:C.buildBreathPattern(6, '1:1'), baseline:null, pacer:{start:0, end:600000}, post:null});
    eq(s.baseline, null); eq(s.post, null); eq(s.rsaMean, null); eq(s.pacerRmssd, null); eq(s.artefactRate, null); eq(s.quality, null); eq(s.cycleCount, 0);
  });
  test('Auswertung: früh beendete Session zählt nur fertige Zyklen', () => {
    const p = simulatedRun();
    const s = C.summarizeSession({beats:p.beats, pattern:C.buildBreathPattern(6, '1:1'), baseline:null, pacer:{start:0, end:25000}, post:null});
    eq(s.cycleCount, 2);
  });
  test('Simulator: Atemfrequenz lässt sich ohne Sprung umstellen', () => {
    const gen = C.createRrSimulator({meanRr:900, amplitude:60, noiseSd:0, artefactProb:0});
    let last = 0;
    for(let i = 0; i < 200; i++) last = gen.next().rr;
    gen.setBreathHz(0.25);
    // Der erste Schritt nach dem Wechsel folgt noch der alten Phase: bei 0,1 Hz höchstens rund 33 ms
    near(gen.next().rr, last, 35, 'Übergang');
    for(let i = 0; i < 200; i++) near(gen.next().rr, 900, 60.001, 'Amplitude');
  });

  /* ---------- Zeitachse ---------- */
  test('Zeitachse: mehrere RR im Paket enden bei der Ankunftszeit', () => {
    const p = new C.SignalPipeline();
    p.ingest([800, 900], 10000);
    near(p.beats[0].t, 9100, 1e-9); near(p.beats[1].t, 10000, 1e-9);
  });
  test('Zeitachse: Latenz-Schwankung erzeugt keinen Abriss und läuft monoton', () => {
    const rng = mulberry32(7);
    const p = new C.SignalPipeline();
    let truth = 0;
    for(let i = 0; i < 300; i++){ truth += 900; p.ingest([900], truth + rng() * 300); }
    eq(p.gaps, 0);
    for(let i = 1; i < p.beats.length; i++){ if(p.beats[i].t <= p.beats[i - 1].t) throw new Error('nicht monoton bei ' + i); }
    near(p.beats[p.beats.length - 1].t, truth, 400);
  });
  function backlogRun(pauseMs, backlogBeats){
    const p = new C.SignalPipeline();
    let now = 0;
    for(let i = 0; i < 20; i++){ now += 900; p.ingest([900 + (i % 2) * 10], now); }
    now += pauseMs;
    for(let i = 0; i < backlogBeats; i++){ p.ingest([900 + (i % 2) * 10], now + i); }
    return {p, now, before:20};
  }
  test('Nachlieferung: lückenlos aufgestaute Schläge sind kein Abriss', () => {
    const {p, now, before} = backlogRun(63000, 70);
    eq(p.gaps, 0);
    eq(p.beats.filter(b => b.afterGap).length, 0);
    for(let i = 1; i < p.beats.length; i++){ if(p.beats[i].t <= p.beats[i - 1].t) throw new Error('nicht monoton bei ' + i); }
    near(p.beats[before].t - p.beats[before - 1].t, 900, 1500, 'Übergang');
    near(p.beats[p.beats.length - 1].t, now, 2500, 'Ende');
  });
  test('Nachlieferung: unvollständige Daten bleiben ein Abriss', () => {
    const {p} = backlogRun(48000, 9);
    eq(p.gaps, 1);
    eq(p.beats.filter(b => b.afterGap).length, 1);
    for(let i = 1; i < p.beats.length; i++){ if(p.beats[i].t <= p.beats[i - 1].t) throw new Error('nicht monoton bei ' + i); }
  });
  test('Nachlieferung: RMSSD nutzt auch die nachgelieferten Paare', () => {
    const {p} = backlogRun(63000, 70);
    p.finish();
    eq(p.beats.filter(b => b.status === 'ok').length, 90);
    near(C.rmssd(p.beats), 10, 1e-9);
  });
  test('Zeitachse: Paket ohne RR zählt, erzeugt aber keinen Schlag', () => {
    const p = new C.SignalPipeline();
    p.ingest([], 1000);
    eq(p.packets, 1); eq(p.packetsWithoutRr, 1); eq(p.beats.length, 0);
  });

  test('RMSSD-Differenz: Session mit beiden Messungen', () => {
    const c = C.rmssdChange({baseline:{rmssd:30, artefactRate:0.01}, post:{rmssd:37.5, artefactRate:0.05}, artefactRate:0.2});
    eq(c.pre, 30); eq(c.post, 37.5); eq(c.diff, 7.5);
    eq(c.disturbed, false, 'genau 5 % und Quote je Messung vor Session-Quote');
  });
  test('RMSSD-Differenz: über 5 % in einer Messung gilt als gestört', () => {
    eq(C.rmssdChange({baseline:{rmssd:30, artefactRate:0.051}, post:{rmssd:37, artefactRate:0}}).disturbed, true);
    eq(C.rmssdChange({baseline:{rmssd:30, artefactRate:0}, post:{rmssd:37, artefactRate:0.051}}).disturbed, true);
  });
  test('RMSSD-Differenz: fehlende Werte und alte Datensätze', () => {
    const old = C.rmssdChange({baseline:{rmssd:30}, post:null, artefactRate:0.01});
    eq(old.pre, 30); eq(old.post, null); eq(old.diff, null); eq(old.disturbed, false);
    eq(C.rmssdChange({baseline:{rmssd:30}, post:{rmssd:31}, artefactRate:0.08}).disturbed, true, 'Session-Quote als Ersatz');
    eq(C.rmssdChange({baseline:{rmssd:30}, post:{rmssd:31}}).disturbed, false, 'ohne jede Quote');
    eq(C.rmssdChange({baseline:{rmssd:null, artefactRate:0}, post:{rmssd:31, artefactRate:0}}).diff, null);
    eq(C.rmssdChange({baseline:null, post:null}).diff, null);
  });
  test('RMSSD-Mittel: Zeitfenster und Ausschluss', () => {
    const s = (date, pre, post, rate) => ({date, baseline:{rmssd:pre, artefactRate:0}, post:post === null ? null : {rmssd:post, artefactRate:rate || 0}});
    const list = [
      s('2026-10-06', 30, 90),         // 31 Tage her: außerhalb
      s('2026-10-07', 30, 40),         // 29 Tage her: nur im 30-Tage-Fenster
      s('2026-10-29', 30, 90),         // 7 Tage her: außerhalb von 7 Tagen
      s('2026-10-30', 30, 32),         // 6 Tage her: innerhalb
      s('2026-11-05', 30, 28),
      s('2026-11-05', 30, 90, 0.2),    // gestört
      s('2026-11-05', 30, null),       // ohne Nachher-Wert
      s('2026-11-06', 30, 90)          // Zukunft
    ];
    const week = C.rmssdChangeMean(list, '2026-11-05', 7);
    eq(week.mean, 0); eq(week.count, 2); eq(week.excluded, 1);
    const month = C.rmssdChangeMean(list, '2026-11-05', 30);
    near(month.mean, (10 + 60 + 2 - 2) / 4, 1e-9); eq(month.count, 4); eq(month.excluded, 1);
    const none = C.rmssdChangeMean([], '2026-11-05', 7);
    eq(none.mean, null); eq(none.count, 0); eq(none.excluded, 0);
  });
  test('segmentStats: Artefaktquote gilt nur für die Messung selbst', () => {
    const beats = [];
    for(let i = 0; i < 10; i++) beats.push({t:i * 1000, rr:1000, status:'ok', afterGap:false});
    for(let i = 10; i < 20; i++) beats.push({t:i * 1000, rr:1000, status:i === 10 ? 'median' : 'ok', afterGap:false});
    eq(C.segmentStats(beats, {start:0, end:10000}).artefactRate, 0);
    near(C.segmentStats(beats, {start:10000, end:20000}).artefactRate, 0.1, 1e-9);
  });

  lines.push('', passed + ' bestanden, ' + failed + ' fehlgeschlagen');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = failed ? 'FEHLER' : 'OK';
})();
</script>
